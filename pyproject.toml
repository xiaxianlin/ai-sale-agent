[project]
# AI 外贸销售智能体系统——代码仓库（迭代 0.1 起）
# 结构遵循 docs/03-技术文档/02-开发规范.md §2
name = "ai-sale-agent"
version = "0.1.0"
description = "AI 外贸销售智能体系统（Phase 0 起）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# 重型解析依赖按需安装（PDF/OCR/ASR），未安装时对应解析器返回明确的未支持错误
pdf = ["pymupdf>=1.24"]
ocr = ["paddleocr>=2.7"]
asr = ["openai-whisper>=20231117"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tools"]
# 可选依赖缺失时，对应测试自动跳过（解析器用 importorskip）
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
