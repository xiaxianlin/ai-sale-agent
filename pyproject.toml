[project]
# AI 外贸销售智能体系统——代码仓库（迭代 0.1 起）
# 结构遵循 docs/03-技术文档/02-开发规范.md §2
name = "ai-sale-agent"
version = "0.1.0"
description = "AI 外贸销售智能体系统（Phase 0 起）"
requires-python = ">=3.12"
dependencies = [
    # CR S4 修复：运行时依赖补齐 + 版本上界（下界不变，上界锁主版本防破坏性升级）
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    # CR S4 修复：真实存储层 / HTTP 客户端运行时依赖补齐（此前仅环境隐式存在）
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    # CR S2 修复：vault 信封加密主路径 AES-256-GCM（缺失即降级 XOR demo 密码，必须入生产依赖）
    "cryptography>=42,<44",
]

[project.optional-dependencies]
# 重型解析依赖按需安装（PDF/OCR/ASR），未安装时对应解析器返回明确的未支持错误
pdf = ["pymupdf>=1.24"]
ocr = ["paddleocr>=2.7"]
asr = ["openai-whisper>=20231117"]
# CR S4 修复：dev 组补 pytest-cov（覆盖率度量，CR 报告 T3 项的工具基线）
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "pytest-cov>=5,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tools"]
# 可选依赖缺失时，对应测试自动跳过（解析器用 importorskip）
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
