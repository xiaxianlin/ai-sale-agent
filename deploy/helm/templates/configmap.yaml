# 知识产权归甲方所有（COM-IP-01）——AI 外贸销售智能体系统交付物。
# CR A4 修复：最小 ConfigMap 模板——租户/入口/白标/配额/迁移与监控参数全量外置
# （运行时读取免发版，FR-SAAS-006）；四类 Deployment 经 envFrom 统一消费。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.saasTenant.id }}-app-config
  namespace: {{ .Values.saasTenant.namespace }}
  labels:
    tenant: {{ .Values.saasTenant.id }}
data:
  tenant_id: {{ .Values.saasTenant.id | quote }}
  tenant_namespace: {{ .Values.saasTenant.namespace | quote }}
  quota_storage_gb: {{ .Values.saasTenant.quota.storageGb | quote }}
  quota_kb_max_chunks: {{ .Values.saasTenant.quota.kbMaxChunks | quote }}
  quota_max_accounts: {{ .Values.saasTenant.quota.maxAccounts | quote }}
  public_domain: {{ .Values.ingress.domain | quote }}
  tls_enabled: {{ .Values.ingress.tls.enabled | quote }}
  ingress_class_name: {{ .Values.ingress.className | quote }}
  brand_primary_color: {{ .Values.brand.primaryColor | quote }}
  brand_logo_url: {{ .Values.brand.logoUrl | quote }}
  migrate_enabled: {{ .Values.migrate.enabled | quote }}
  migrate_backoff_limit: {{ .Values.migrate.backoffLimit | quote }}
  monitoring_enabled: {{ .Values.monitoring.enabled | quote }}
  monitoring_prometheus_retention: {{ .Values.monitoring.prometheusRetention | quote }}
