# 知识产权归甲方所有（COM-IP-01）
# =============================================================================
# ai-sale.conf —— Nginx TLS 基线配置（NFR-SEC-05 传输加密：全部对外接口 HTTPS/TLS）
# 依据：docs/07-实现方案/NFR/SR-NFR-SEC-05-传输加密.md §6.2（TLS 基线）/ §6.3（wss）
# 部署形态：nginx:1.27 容器，全部公网流量的唯一入口（SR-AG-001 §6.1：仅本容器发布 80/443）
#
# 放置路径：容器内 /etc/nginx/conf.d/ai-sale.conf（http{} 上下文内 include，
#           勿放主上下文）。上线前必须替换占位符 <platform-domain> 与证书路径。
# 变更纪律：协议/套件/HSTS 等基线参数外置于 app_config（scope=security.tls.*，
#           SR-NFR-SEC-05 §7），改基线须走配置变更流程并重渲染本文件，禁止直接魔改。
# =============================================================================

# ---------------------------------------------------------------------------
# 上游服务（全部内网容器，不暴露公网）
# SR-AG-001 §6.1：compose 中内网服务一律不写公网 ports 映射，仅容器网络内 DNS 互访；
# PG(5432)/Milvus(19530)/Redis(6379)/TEI(8080) 等数据层更不得反代暴露（SR §6.8：
# 安全组仅放行 80/443 公网入，内网端口只允许集群安全组互访）。
# CR A4 修复（拓扑对齐）：app / site 服务定义见 deploy/compose-package/compose.yaml
# （demo 单机形态，同名服务容器网络 DNS 互访即本组 upstream）；Helm 形态对应
# deploy/helm/templates/ 中 Service。
# ---------------------------------------------------------------------------
upstream app_backend {          # kb-service / 管理后台 API（FastAPI，容器名:端口）
    server app:8000;
}
upstream site_ws_backend {      # site-service WebSocket 通道（/ws/chat，FR-SITE-001）
    server site:8000;
}
upstream site_api_backend {     # site-service HTTP（session API / 长轮询）
    server site:8000;
}

# ---------------------------------------------------------------------------
# TLS 全局基线（http{} 级，下方全部 443 server 继承）
# ---------------------------------------------------------------------------
# 仅 TLS 1.2/1.3：SSLv3/TLS1.0/TLS1.1 一律禁用（SR §2 偏差①：下界收紧，sslscan 零弱协议）
ssl_protocols TLSv1.2 TLSv1.3;

# 仅 AEAD 前向保密套件：无 CBC/RC4/NULL/弱 DH（SR §6.2 套件白名单，逐字一致）
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_prefer_server_ciphers on;              # 服务端优选套件，防降级协商
ssl_session_cache shared:SSL:10m;          # 会话复用摊薄握手开销（检索 ≤500ms 预算中网关 <10ms）
ssl_session_timeout 1d;
ssl_session_tickets off;                   # 票证密钥轮换难控，关闭更稳妥
ssl_stapling on;                           # OCSP Stapling：服务端代查吊销状态并随握手附带证明
ssl_stapling_verify on;
resolver 223.5.5.5 223.6.6.6 valid=300s;   # 阿里云公共 DNS（OCSP/上游解析）
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# WebSocket 升级头映射（wss 必需）：按 Upgrade 头动态设置 Connection，
# 非升级请求置 close，避免长连接被默认 keep-alive 语义掐断
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 80 端口唯一职责：ACME HTTP-01 挑战 + 301 跳转 HTTPS（明文端口无任何业务内容）
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # ACME 续期挑战目录例外（^~ 前缀匹配优先，不得被下方 301 吞掉——证书自动续期依赖此路径）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/challenge;
    }

    # 其余一切流量 301 到同 URI 的 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443 默认兜底 server：未登记域名的 TLS 握手直接拒绝
# SNI 纪律（SR §6.4）：证书与域名一一对应，禁用默认证书兜底匹配未登记 Host
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # nginx ≥1.19.4：无匹配 server_name 时拒绝握手而非降级到默认证书
}

# ---------------------------------------------------------------------------
# 后台/培训端入口：app / train 子域（一张多 SAN 平台证书）
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name app.<platform-domain> train.<platform-domain>;

    ssl_certificate     /etc/nginx/certs/platform_fullchain.pem;  # 平台多 SAN 证书（HTTP-01 签发）
    ssl_certificate_key /etc/nginx/certs/platform.key;

    client_max_body_size 20m;   # 文档上传（培训材料/知识库附件）预留
    # HSTS：强制浏览器后续一律走 HTTPS（max-age 一年；always 保证非 2xx 响应也携带）
    # 注意 nginx 继承规则：location 内一旦出现 add_header（如下方静态资源缓存头），
    # server 级 HSTS 即不再继承，须在该 location 内重复声明。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 管理后台与培训端 API（JWT 鉴权在应用层，限流前置见 SR-KB-031）
    location /api/v1/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # 告知后端原始协议为 https（生成绝对链接/审计用）
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;                   # 外部依赖超时纪律（开发规范 §3）
    }

    # 管理后台/培训端前端静态资源（Vue 构建产物）
    location / {
        root /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# 统一检索 API 入口：api 子域（API Key 鉴权在应用层，SR-KB-030/031）
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.<platform-domain>;

    ssl_certificate     /etc/nginx/certs/platform_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/platform.key;

    client_max_body_size 5m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 检索 API：经网关暴露的唯一公网 API 面（限流前置见 SR-KB-031）
    location /api/v1/knowledge/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 内部接口不经公网入口暴露：/internal/* 仅限容器内网访问（SR §6.8；
    # P4 跨主机场景可启用 mTLS 片段：include /etc/nginx/snippets/mtls-internal.conf）
    location /internal/ {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# 独立站 SDK 入口：chat 子域（与后台域名分离，06-安全 §5；承载 sdk.js 与 wss 通道）
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name chat.<platform-domain>;

    # 独立证书：与后台证书错峰续期（域名分离原则，SR §6.4）
    ssl_certificate     /etc/nginx/certs/chat_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chat.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # wss 通道：TLS 在网关终止，升级头透传给 site-service（FR-SITE-001：SDK 心跳 30s）
    location /ws/chat {
        proxy_pass http://site_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;             # WebSocket 协议升级头必须透传
        proxy_set_header Connection $connection_upgrade;    # 配合上方 map 动态设置
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;    # 读超时须大于应用判死窗口 90s 与长轮询 hold 25s，防网关先于应用掐断
        proxy_send_timeout 120s;
        proxy_socket_keepalive on;  # TCP 层保活，穿越中间设备空闲回收
        proxy_buffering off;        # 消息即产即推（generating 状态指示不排队）
    }

    # SDK 静态脚本（短缓存，发版即生效）
    location /sdk.js {
        root /usr/share/nginx/html/site;
        # 此处 add_header 会使 server 级 HSTS 失效（nginx 继承规则），故重复声明
        add_header Cache-Control "public, max-age=300";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 独立站 session API（长轮询 hold 25s + 余量）
    location /api/v1/site/ {
        proxy_pass http://site_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
    }
}
