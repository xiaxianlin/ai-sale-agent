# 知识产权归甲方所有（COM-IP-01）——AI 外贸销售智能体系统交付物。
# 许可与再分发须依据双方合同约定执行（COM-IP-02 乙方零使用权）。
# 本文件由 tools/agent/gen_cluster_compose.py 生成，请勿手改；重新生成命令：
#   python3 tools/agent/gen_cluster_compose.py
x-cluster:
  instance_count: 28
  topology: proxy-egress-NN + agent-runner-NN 双容器/账号（CR A5 修复：与 deploy/compose/agent-runner.yaml 同款）
  account_split:
    main: 4
    sub: 24
  host_density: 3
  hosts:
  - runner-01
  - runner-02
  - runner-03
  - runner-04
  - runner-05
  - runner-06
  - runner-07
  - runner-08
  - runner-09
  - runner-10
  proxy_note: 出口 IP 与凭证均为占位（NFR-SEC-04），现场调研后经 .env/Docker secrets 注入
  proxy_url_template: http://<PROXY-USER>:<PROXY-PASS>@<PROXY-IP-01>:<PORT>
  generated_by: tools/agent/gen_cluster_compose.py
services:
  proxy-egress-01:
    restart: always
    image: ai-sale/proxy-egress:0.1.0
    cap_add:
    - NET_ADMIN
    environment:
    - EXPECTED_EGRESS_IP=<PROXY-IP-01>
    secrets:
    - proxy_url_01
    healthcheck:
      test:
      - CMD-SHELL
      - sh /app/check-egress-ip.sh
      interval: 30s
      timeout: 10s
      retries: 3
  agent-runner-01:
    restart: always
    image: ai-sale/openclaw-runner:0.1.0
    container_name: agent-runner-01
    network_mode: service:proxy-egress-01
    environment:
    - ACCOUNT_ID=7001
    - ACCOUNT_TYPE=main
    - HOST_NODE=runner-01
    - KB_AGENT_WINDOW_START=08:40
    - KB_AGENT_ONLINE_SLOTS=2
    - HTTP_PROXY=http://127.0.0.1:6152
    - HTTPS_PROXY=http://127.0.0.1:6152
    - NO_PROXY=localhost,127.0.0.1,app,postgres,redis,milvus,tei,nginx
    - KB_OPENCLAW_ENDPOINT=http://127.0.0.1:9223
    - KB_AGENT_MASTER_KEY_FILE=/run/secrets/vault_master_key
    volumes:
    - cookie-01:/data/cookies
    - spool-01:/data/spool
    secrets:
    - vault_master_key
    depends_on:
    - proxy-egress-01
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9223/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
    - autoheal=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
